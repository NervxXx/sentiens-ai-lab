<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="1200" height="630" fill="#0A0A0F"/>
  
  <!-- Градиентный эффект -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Декоративные элементы -->
  <circle cx="100" cy="100" r="50" fill="url(#gradient)" opacity="0.3"/>
  <circle cx="1100" cy="530" r="80" fill="url(#gradient)" opacity="0.2"/>
  <circle cx="600" cy="315" r="200" fill="url(#gradient)" opacity="0.1"/>
  
  <!-- Заголовок -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white">
    SentiensApps
  </text>
  
  <!-- Подзаголовок -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#9CA3AF">
    Мы выращиваем интеллект
  </text>
  
  <!-- Описание -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#6B7280">
    Семейство AI-приложений для прорыва
  </text>
  
  <!-- Декоративная линия -->
  <rect x="400" y="410" width="400" height="2" fill="url(#gradient)" filter="url(#glow)"/>
  
  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4B5563">
    sentiensapps.com
  </text>
</svg>